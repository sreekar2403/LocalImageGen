[project]
name = "LocalImageGen"
version = "0.1.0"
description = "Local AI image generation pipeline for offline prompt enhancement and image synthesis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "ollama>=0.6.2",
    "pydantic-settings>=2.0.0",
    "sentencepiece>=0.2.2",
    "structlog>=24.0.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
