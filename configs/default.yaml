# LocalImageGen default configuration
# Values here are overridden by environment variables and CLI arguments.

# Model selection
vision_model: "black-forest-labs/FLUX.2-klein-4B"
ollama_model: "gemma4:e4b"

# Generation parameters
width: 1024
height: 768
num_inference_steps: 12
seed: 42
device: "cuda"

# Storage
output_dir: "images"

# Logging
log_level: "INFO"
