<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LocalGen</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #e4e4e7;
    --border: #e4e4e7;
    --border-light: #ececef;
    --text: #18181b;
    --text-secondary: #71717a;
    --text-tertiary: #a1a1aa;
    --accent: #18181b;
    --accent-hover: #000000;
    --accent-soft: #f4f4f5;
    --accent-contrast: #ffffff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warning: #b45309;
    --warning-bg: #fffbeb;
    --user-bg: #18181b;
    --user-text: #fafafa;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 6px 20px rgba(0,0,0,.08);
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --transition: 120ms ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--font);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Header ─── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo svg { width: 18px; height: 18px; color: var(--text); flex-shrink: 0; }
  header h1 {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.1px;
  }
  .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    background: var(--surface-2);
    color: var(--text-secondary);
    font-family: var(--mono);
  }
  .status-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: background var(--transition);
  }
  .status-pill.ok { color: #166534; }
  .status-pill.ok .dot { background: var(--success); }
  .status-pill.bad { color: var(--danger); }
  .status-pill.bad .dot { background: var(--danger); }

  /* ─── Mode Tabs ─── */
  .mode-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .mode-tab {
    padding: 9px 4px;
    margin-right: 18px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border: none;
    background: transparent;
    border-bottom: 2px solid transparent;
    transition: color var(--transition), border-color var(--transition);
    user-select: none;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ─── Messages ─── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 150ms ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg .avatar {
    flex: 0 0 22px; height: 22px;
    border-radius: 5px;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700;
    margin-top: 2px;
    letter-spacing: 0.2px;
  }
  .msg.user .avatar { background: var(--accent); color: var(--accent-contrast); }
  .msg.assistant .avatar { background: var(--surface-3); color: var(--text-secondary); }
  .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 11px 14px;
    flex: 1;
    min-width: 0;
  }
  .msg.user .bubble {
    background: var(--surface-2);
    border-color: var(--border);
  }
  .bubble .text {
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.6;
  }
  .cmd-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-3);
    padding: 2px 7px;
    border-radius: 5px;
    margin-bottom: 6px;
  }
  .thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .thumbs img, .thumbs .file {
    height: 56px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    object-fit: cover;
    background: var(--surface-2);
  }
  .thumbs .file {
    display: grid; place-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* ─── Result Card ─── */
  .result {
    margin-top: 8px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .result img, .result video {
    width: 100%;
    display: block;
    background: var(--surface-2);
  }
  .result .meta {
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    align-items: center;
    border-top: 1px solid var(--border-light);
    font-family: var(--mono);
  }
  .result .meta .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface-2);
  }
  .result .meta a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    margin-left: auto;
  }
  .result .meta a:hover { text-decoration: underline; }
  .progress { margin-top: 8px; }
  .progress .bar {
    height: 4px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .progress .label {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-family: var(--mono);
  }
  .warn { color: var(--warning); font-size: 12px; margin-top: 6px; }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }

  /* ─── Empty State ─── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 10px;
    color: var(--text-tertiary);
    padding: 40px;
  }
  .empty-state svg { width: 30px; height: 30px; color: var(--text-tertiary); margin-bottom: 4px; }
  .empty-state h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .empty-state p {
    font-size: 12.5px;
    text-align: center;
    max-width: 380px;
    line-height: 1.6;
  }
  .empty-state .hint {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-tertiary);
  }
  .empty-state .hint b { color: var(--text-secondary); font-weight: 600; }

  /* ─── Footer / Composer ─── */
  footer { background: var(--surface); border-top: 1px solid var(--border); position: relative; }

  /* Settings Panel */
  .settings-panel {
    display: none;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border-light);
    background: var(--surface-2);
  }
  .settings-panel.open { display: block; }
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    max-width: 760px;
    margin: 0 auto;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field input, .field select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-size: 12.5px;
    font-family: var(--font);
    transition: border-color var(--transition);
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--text-tertiary);
  }
  .field .row { display: flex; gap: 8px; }
  .field .row input { flex: 1; min-width: 0; }
  .toggle-row { display: flex; align-items: center; gap: 9px; padding-top: 4px; }
  .toggle {
    position: relative;
    width: 34px; height: 20px;
    appearance: none;
    background: var(--surface-3);
    border-radius: 12px;
    cursor: pointer;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: transform var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .toggle:checked { background: var(--accent); }
  .toggle:checked::after { transform: translateX(14px); }
  .toggle-label { font-size: 12.5px; color: var(--text-secondary); }

  /* Platform selector */
  .platform-row { grid-column: 1 / -1; }
  .platform-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .platform-chip {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .platform-chip:hover { border-color: var(--text-tertiary); color: var(--text); }
  .platform-chip.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

  /* Composer */
  .composer-wrap { padding: 12px 22px 14px; position: relative; }
  .composer { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; margin: 0 auto; }
  .composer .side-btns { display: flex; gap: 6px; }
  .composer .icon-btn {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all var(--transition);
  }
  .composer .icon-btn svg { width: 16px; height: 16px; }
  .composer .icon-btn:hover { border-color: var(--text-tertiary); color: var(--text); }
  .composer .icon-btn.active { border-color: var(--text); color: var(--text); background: var(--surface-2); }
  .composer textarea {
    flex: 1;
    resize: none;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 9px 12px;
    font: 13.5px/1.5 var(--font);
    max-height: 160px;
    min-height: 36px;
    transition: border-color var(--transition);
  }
  .composer textarea:focus { outline: none; border-color: var(--text-tertiary); }
  .composer textarea::placeholder { color: var(--text-tertiary); }
  .composer .send {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: var(--radius-md);
    padding: 0 16px;
    height: 36px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12.5px;
    font-family: var(--font);
    transition: background var(--transition);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .composer .send:hover { background: var(--accent-hover); }
  .composer .send:disabled { opacity: .45; cursor: default; }
  .composer .send svg { width: 14px; height: 14px; }

  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; max-width: 760px; margin-left: auto; margin-right: auto; }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 20px;
    padding: 3px 5px 3px 10px;
    font-size: 11.5px;
    font-weight: 500;
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }
  .chip button {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: background var(--transition);
  }
  .chip button:hover { background: var(--surface-3); color: var(--text); }

  /* ─── Command palette ─── */
  .cmd-palette {
    display: none;
    position: absolute;
    left: 22px; right: 22px;
    bottom: 100%;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
    z-index: 50;
  }
  .cmd-palette.open { display: block; }
  .cmd-palette-list { max-height: 260px; overflow-y: auto; padding: 6px; }
  .cmd-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .cmd-item.active { background: var(--surface-2); }
  .cmd-item .name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--text); flex: 0 0 auto; }
  .cmd-item .desc { font-size: 12px; color: var(--text-secondary); }
  .cmd-palette-empty { padding: 14px; font-size: 12.5px; color: var(--text-tertiary); text-align: center; }

  /* SVG-specific group */
  .grp { display: none; }
  .grp.show { display: contents; }

  /* Scrollbar */
  #messages::-webkit-scrollbar, .cmd-palette-list::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track, .cmd-palette-list::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb, .cmd-palette-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

  @media (max-width: 640px) {
    header { padding: 10px 14px; }
    .mode-bar { padding: 0 14px; overflow-x: auto; }
    #messages { padding: 14px; }
    .composer-wrap { padding: 10px 14px 12px; }
    .cmd-palette { left: 14px; right: 14px; }
    .settings-panel { padding: 12px 14px; }
    .settings-grid { grid-template-columns: 1fr 1fr; }
    .msg { gap: 8px; }
    .bubble { padding: 10px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5-9 9"/></svg>
    <h1>LocalGen</h1>
  </div>
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">connecting</span>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-tab active" data-mode="image">Image</button>
  <button class="mode-tab" data-mode="ref">Image + Ref</button>
  <button class="mode-tab" data-mode="svg">SVG</button>
  <button class="mode-tab" data-mode="video">Video</button>
</div>

<div id="messages">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5-9 9"/></svg>
    <h2>What would you like to create?</h2>
    <p>Generate images, SVGs, or videos from text prompts. Attach reference images for editing.</p>
    <div class="hint">Type <b>/</b> in the box for quick edit commands like <b>/marketing</b> or <b>/explode</b></div>
  </div>
</div>

<footer>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-grid" id="settingsGrid"></div>
  </div>
  <div class="composer-wrap">
    <div class="cmd-palette" id="cmdPalette">
      <div class="cmd-palette-list" id="cmdPaletteList"></div>
    </div>
    <div class="composer">
      <div class="side-btns">
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Toggle settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-9.5-11H1m22 0h-1.5m-2.7-7.8 1.1-1.1M4.1 19.9l1.1-1.1m0-13.4L4.1 4.1m15.8 15.8-1.1-1.1"/></svg>
        </button>
        <button class="icon-btn" id="attachBtn" title="Attach image(s)" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21.4 11.6 12.4 20.6a5 5 0 0 1-7-7l9.6-9.6a3.3 3.3 0 0 1 4.7 4.7L10 18.1a1.7 1.7 0 0 1-2.3-2.3l8.4-8.4"/></svg>
        </button>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*" hidden>
      <textarea id="prompt" rows="1" placeholder="Describe what you want to generate, or type / for commands..."></textarea>
      <button class="send" id="sendBtn">
        Generate
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const messages = $("#messages");
const state = { attachments: [], mode: "image" };

function fileUrl(absPath) { return "/file?p=" + encodeURIComponent(absPath); }
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function scrollBottom() { messages.scrollTop = messages.scrollHeight; }

function removeEmptyState() {
  const e = messages.querySelector(".empty-state");
  if (e) e.remove();
}

function addMessage(role, text, attachments, cmdLabel) {
  removeEmptyState();
  const el = document.createElement("div");
  el.className = "msg " + role;
  const who = role === "user" ? "You" : "AI";
  let html = `<div class="avatar">${who}</div><div class="bubble">`;
  if (cmdLabel) html += `<span class="cmd-badge">/${escapeHtml(cmdLabel)}</span>`;
  if (text) html += `<div class="text">${escapeHtml(text)}</div>`;
  if (attachments && attachments.length) {
    html += `<div class="thumbs">`;
    for (const a of attachments) {
      html += a.isImage
        ? `<img src="${a.url}" alt="${escapeHtml(a.name)}">`
        : `<div class="file">${escapeHtml(a.name)}</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
  messages.appendChild(el);
  scrollBottom();
  return el;
}

function renderArtifact(art) {
  const wrap = document.createElement("div");
  wrap.className = "result";
  let media = "";
  if (art.kind === "video") {
    media = `<video controls src="${fileUrl(art.path)}"></video>`;
  } else if (art.kind === "svg") {
    const showUrl = (art.preview_path && art.preview_path !== art.path) ? fileUrl(art.preview_path) : fileUrl(art.path);
    media = `<img src="${showUrl}" alt="svg preview">`;
  } else {
    media = `<img src="${fileUrl(art.path)}" alt="generated image">`;
  }
  let meta = `<div class="meta">`;
  meta += `<span class="badge">${escapeHtml(art.kind)}</span>`;
  if (art.width) meta += `<span class="badge">${art.width}&times;${art.height}</span>`;
  if (art.steps) meta += `<span class="badge">${art.steps} steps</span>`;
  if (art.seed != null) meta += `<span class="badge">seed ${art.seed}</span>`;
  if (art.elapsed_s != null) meta += `<span class="badge">${art.elapsed_s.toFixed(1)}s</span>`;
  meta += `<a href="${fileUrl(art.path)}" download>download</a>`;
  if (art.kind === "svg" && art.preview_path && art.preview_path !== art.path) {
    meta += `<a href="${fileUrl(art.path)}" download style="margin-left:8px">svg source</a>`;
  }
  meta += `</div>`;
  let warns = "";
  for (const w of (art.warnings || [])) warns += `<div class="warn">&#9888; ${escapeHtml(w)}</div>`;
  wrap.innerHTML = media + meta + warns;
  return wrap;
}

function setBusy(busy) {
  const btn = $("#sendBtn");
  btn.disabled = busy;
  btn.innerHTML = busy
    ? `Working...<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="spin"><path d="M12 2v4m0 12v4m-8-10H0m24 0h-4m-3.5-6.5 2.8-2.8M4.7 19.3l2.8-2.8m0-13.4L4.7 4.7m14.8 14.8-2.8-2.8"/></svg>`
    : `Generate<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>`;
}

async function uploadFiles(files) {
  for (const f of files) {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/v1/upload", { method: "POST", body: fd });
    if (!r.ok) { alert("Upload failed: " + (await r.text())); continue; }
    const j = await r.json();
    const isImage = (f.type || "").startsWith("image/");
    state.attachments.push({ path: j.path, name: j.filename, url: fileUrl(j.path), isImage });
  }
  renderChips();
}

function renderChips() {
  const c = $("#chips");
  c.innerHTML = "";
  state.attachments.forEach((a, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${escapeHtml(a.name)} <button title="remove">&times;</button>`;
    chip.querySelector("button").onclick = () => { state.attachments.splice(i, 1); renderChips(); };
    c.appendChild(chip);
  });
}

/* ─── Slash commands: quick edit templates, à la Claude Code / Codex ─── */
const COMMANDS = [
  { cmd: "marketing", label: "Marketing", desc: "Polished ad-ready creative",
    base: "Transform this into a polished marketing creative: professional studio lighting, bold clean composition, vibrant on-brand color grading, ample negative space for copy, high-end advertising-photography look." },
  { cmd: "product-shot", label: "Product Shot", desc: "Clean studio product photography",
    base: "Present this as a clean studio product photograph: soft even lighting, subtle shadow, seamless white background, sharp focus, commercial catalog quality." },
  { cmd: "explode", label: "Explode", desc: "Exploded-view technical breakdown",
    base: "Create an exploded-view technical illustration: separate the components along a central axis with thin connector lines, clean studio lighting, and a neutral background." },
  { cmd: "restyle", label: "Restyle", desc: "Reimagine in a new visual style",
    base: "Fully restyle the image: keep the original subject and composition, but adopt a new visual style, palette, and rendering technique as described below." },
  { cmd: "colorize", label: "Colorize", desc: "Add natural, realistic color",
    base: "Colorize the image with natural, realistic colors, preserving all original details, tones, and composition." },
  { cmd: "remove-bg", label: "Remove Background", desc: "Clean, seamless backdrop",
    base: "Remove the background and replace it with a clean, seamless, neutral studio backdrop, keeping the subject perfectly intact and in sharp focus." },
  { cmd: "isolate", label: "Isolate Subject", desc: "Cut distractions, keep subject",
    base: "Isolate the main subject, removing all background clutter and distracting elements, and place it on a plain neutral background with a soft natural shadow." },
  { cmd: "enhance-detail", label: "Enhance Detail", desc: "Sharper focus, richer texture",
    base: "Enhance the image with significantly more fine detail, sharper focus, and richer textures, while preserving the original composition, subject, and colors exactly." },
  { cmd: "caption", label: "Caption", desc: "Add a bold text overlay",
    base: "Add a bold, high-contrast text caption overlay to the image, using tasteful typography.", freeform: true },
  { cmd: "meme", label: "Meme", desc: "Turn into a captioned meme",
    base: "Turn this into a humorous meme-style image with bold white Impact-style caption text, high contrast, and a playful exaggerated composition.", freeform: true },
];

function expandCommand(text) {
  const m = text.match(/^\/([a-z-]+)\b([\s\S]*)$/i);
  if (!m) return null;
  const cmd = COMMANDS.find(c => c.cmd === m[1].toLowerCase());
  if (!cmd) return null;
  const extra = m[2].trim();
  let prompt = cmd.base;
  if (extra) prompt += cmd.freeform ? ` Caption text: "${extra}"` : ` Additional direction: ${extra}`;
  return { cmd, prompt };
}

const palette = $("#cmdPalette");
const paletteList = $("#cmdPaletteList");
let paletteMatches = [];
let paletteIndex = 0;

function closePalette() {
  palette.classList.remove("open");
  paletteMatches = [];
}

function renderPalette() {
  paletteList.innerHTML = "";
  if (!paletteMatches.length) {
    paletteList.innerHTML = `<div class="cmd-palette-empty">No matching commands</div>`;
    return;
  }
  paletteMatches.forEach((c, i) => {
    const item = document.createElement("div");
    item.className = "cmd-item" + (i === paletteIndex ? " active" : "");
    item.innerHTML = `<span class="name">/${c.cmd}</span><span class="desc">${escapeHtml(c.desc)}</span>`;
    item.onmousedown = (e) => { e.preventDefault(); pickCommand(c); };
    paletteList.appendChild(item);
  });
}

function pickCommand(c) {
  $("#prompt").value = "/" + c.cmd + " ";
  closePalette();
  $("#prompt").focus();
}

function updatePalette() {
  const el = $("#prompt");
  const text = el.value;
  const showFor = state.mode === "image" || state.mode === "ref";
  const m = showFor && text.match(/^\/([a-z-]*)$/i);
  if (!m) { closePalette(); return; }
  const q = m[1].toLowerCase();
  paletteMatches = COMMANDS.filter(c => c.cmd.startsWith(q));
  paletteIndex = 0;
  palette.classList.add("open");
  renderPalette();
}

function setMode(mode) {

  $("#prompt").placeholder = mode === "ref"
    ? "Describe the edit you want, or type / for a command..."
    : "Describe what you want to generate, or type / for commands...";
  buildSettingsPanel(mode);
  closePalette();
}

// ─── Send ───
async function send() {
  const raw = $("#prompt").value.trim();
  const mode = state.mode;
  const attaches = state.attachments.slice();
  if (!raw && !(mode === "ref" && attaches.length)) return;

  let text = raw;
  let cmdLabel = null;
  if (mode === "image" || mode === "ref") {
    const expanded = expandCommand(raw);
    if (expanded) {
      text = expanded.prompt;
      cmdLabel = expanded.cmd.cmd;
    }
  }

  const userAttachments = attaches.map(a => ({ name: a.name, url: a.url, isImage: a.isImage }));
  addMessage("user", cmdLabel ? raw.replace(/^\/[a-z-]+\s*/i, "") : raw, userAttachments, cmdLabel);

  const assistantEl = addMessage("assistant", "Thinking...");
  const bubble = assistantEl.querySelector(".bubble");
  setBusy(true);

  let promptText = text;
  const enhanceEl = $("#enhance");
  const enhanceEnabled = enhanceEl && enhanceEl.checked;

  // Step 1: If enhance is ON for image/ref, call /v1/enhance first to get suggestions
  // (skipped when a slash command already produced a fully-formed instruction)
  if (enhanceEnabled && !cmdLabel && (mode === "image" || mode === "ref")) {
    bubble.innerHTML = `<div class="text">Enhancing prompt...</div>`;
    scrollBottom();
    try {
      const er = await fetch("/v1/enhance", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text, suggest_overlays: true }),
      });
      if (!er.ok) throw new Error("Enhancement failed");
      const eData = await er.json();
      promptText = eData.prompt || text;

      // Auto-fill overlay fields from suggestions
      if (eData.overlay) {
        const o = eData.overlay;
        const textOverlayEl = $("#textOverlay");
        const textPositionEl = $("#textPosition");
        const textColorEl = $("#textColor");
        const textFontSizeEl = $("#textFontSize");
        if (textOverlayEl && o.text) textOverlayEl.value = o.text;
        if (textPositionEl && o.position) textPositionEl.value = o.position;
        if (textColorEl && o.color) textColorEl.value = o.color;
        if (textFontSizeEl && o.font_size) textFontSizeEl.value = o.font_size;
      }
    } catch (e) {
      // Enhancement failed, use original prompt
      promptText = text;
    }
    bubble.innerHTML = `<div class="text">Generating...</div>`;
    scrollBottom();
  }

  const body = { prompt: promptText };

  if (mode === "image" || mode === "ref") {
    const w = parseInt($("#dimW")?.value, 10);
    const h = parseInt($("#dimH")?.value, 10);
    if (w) body.width = w;
    if (h) body.height = h;
    body.platform = state.platform || "default";
  }

  const stepsEl = $("#steps");
  const seedEl = $("#seed");
  if (stepsEl) { const v = parseInt(stepsEl.value, 10); if (v) body.steps = v; }
  if (seedEl) { const v = seedEl.value.trim(); if (v !== "") body.seed = parseInt(v, 10); }

  // Text overlay params (use auto-filled values if enhance was ON)
  const textOverlayEl = $("#textOverlay");
  const textPositionEl = $("#textPosition");
  const textColorEl = $("#textColor");
  const textFontSizeEl = $("#textFontSize");
  if (textOverlayEl && textOverlayEl.value.trim()) {
    body.text_overlay = textOverlayEl.value.trim();
    if (textPositionEl) body.text_position = textPositionEl.value;
    if (textColorEl) body.text_color = textColorEl.value;
    if (textFontSizeEl) body.text_font_size = parseInt(textFontSizeEl.value, 10) || 48;
  }

  let endpoint = "/v1/image";
  if (mode === "image") {
    endpoint = "/v1/image";
  } else if (mode === "ref") {
    endpoint = "/v1/image/edit";
    body.image_paths = attaches.map(a => a.path);
  } else if (mode === "svg") {
    endpoint = "/v1/svg";
    body.mode = $("#svgMode").value;
    body.svg_kind = $("#svgKind").value;
    body.colors = parseInt($("#colors").value, 10) || 12;
    if (enhanceEnabled) body.enhance = true;
  } else if (mode === "video") {
    endpoint = "/v1/video";
    body.preset = $("#preset").value;
    if (enhanceEnabled) body.enhance = true;
  }

  try {
    const r = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));

    if (mode === "video") {
      bubble.innerHTML = "";
      const prog = document.createElement("div");
      prog.className = "progress";
      prog.innerHTML = `<div class="bar"><i></i></div><div class="label">queued...</div>`;
      bubble.appendChild(prog);
      const bar = prog.querySelector("i");
      const label = prog.querySelector(".label");
      const jobId = data.job_id;
      const poll = async () => {
        const jr = await fetch("/jobs/" + jobId);
        const job = await jr.json();
        const pct = Math.round((job.progress || 0) * 100);
        bar.style.width = pct + "%";
        label.textContent = `${job.status} · ${pct}%${job.progress_msg ? " · " + job.progress_msg : ""}`;
        if (job.status === "done") {
          bubble.innerHTML = "";
          if (job.result) bubble.appendChild(renderArtifact(job.result));
          else bubble.textContent = "Done.";
        } else if (job.status === "error" || job.status === "cancelled") {
          bubble.innerHTML = `<div class="err">${escapeHtml(job.error || job.status)}</div>`;
        } else {
          setTimeout(poll, 1500);
        }
      };
      poll();
    } else {
      bubble.innerHTML = "";
      bubble.appendChild(renderArtifact(data));
    }
  } catch (e) {
    bubble.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
  } finally {
    setBusy(false);
    $("#prompt").value = "";
    state.attachments = [];
    renderChips();
    scrollBottom();
  }
}

// ─── Status ───
async function refreshStatus() {
  try {
    const r = await fetch("/health");
    const h = await r.json();
    const pill = $("#statusPill");
    const dot = $("#statusDot");
    const text = $("#statusText");
    pill.className = "status-pill " + (h.loaded ? "ok" : "bad");
    const q = h.quantization && h.quantization !== "none" ? ` · ${h.quantization}` : "";
    text.textContent = `${h.model}${q} · ${h.loaded ? "ready" : "not loaded"}`;
  } catch (e) {
    const pill = $("#statusPill");
    pill.className = "status-pill bad";
    $("#statusText").textContent = "worker unreachable";
  }
}

// ─── Wiring ───
document.querySelectorAll(".mode-tab").forEach(tab => {
  tab.addEventListener("click", () => setMode(tab.dataset.mode));
});

$("#settingsBtn").addEventListener("click", () => {
  const panel = $("#settingsPanel");
  const btn = $("#settingsBtn");
  panel.classList.toggle("open");
  btn.classList.toggle("active");
});

$("#attachBtn").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", (e) => {
  if (e.target.files.length) uploadFiles(e.target.files);
  e.target.value = "";
});
$("#sendBtn").addEventListener("click", send);
$("#prompt").addEventListener("keydown", (e) => {
  if (palette.classList.contains("open")) {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIndex = Math.min(paletteIndex + 1, paletteMatches.length - 1); renderPalette(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteIndex = Math.max(paletteIndex - 1, 0); renderPalette(); return; }
    if (e.key === "Enter" || e.key === "Tab") { if (paletteMatches[paletteIndex]) { e.preventDefault(); pickCommand(paletteMatches[paletteIndex]); return; } }
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#prompt").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
  updatePalette();
});
document.addEventListener("click", (e) => {
  if (!palette.contains(e.target) && e.target !== $("#prompt")) closePalette();
});

setMode("image");
refreshStatus();
setInterval(refreshStatus, 15000);
</script>
